[env]
platform = espressif32@6.7.0
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson @ 7.1.0
    mathieucarbou/ESPAsyncWebServer @ 3.1.5
    XPT2046_Touchscreen

build_flags =
    -D KRYONOS_VERSION=\"1.0.0\"
    -D KRYONOS_API_LEVEL=1

[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    
    -D TOUCH_CS=33
    -D TOUCH_IRQ=36
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000

[env:HMI]
board = esp32-s3-devkitc-1
monitor_filters = esp32_exception_decoder
build_flags =
    ${env.build_flags}

    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    
    -D PWR_EN_PIN=10
    -D PWR_ON_PIN=14
    
	-D TOUCHSCREEN_SCLK_PIN=1
	-D TOUCHSCREEN_MISO_PIN=4
	-D TOUCHSCREEN_MOSI_PIN=3
	-D TOUCHSCREEN_CS_PIN=2
	-D TOUCHSCREEN_IRQ_PIN=9

	-D SD_MISO_PIN=13
    -D SD_MOSI_PIN=11
    -D SD_SCLK_PIN=12   
    
    -D USER_SETUP_LOADED=1
    -include $PROJECT_LIBDEPS_DIR/$PIOENV/TFT_eSPI/User_Setups/Setup207_LilyGo_T_HMI.h

board_build.arduino.memory_type = qio_opi
