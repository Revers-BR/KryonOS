; =========================================================================
; AMBIENTE: LilyGO T-HMI (ESP32-S3 + ST7789 Paralelo 8-bit)
; =========================================================================
[env:HMI]
board = esp32-s3-devkitc-1
monitor_filters = esp32_exception_decoder
board_build.arduino.memory_type = qio_opi
build_type = debug

lib_deps =
    ${env.lib_deps}
    https://github.com/PaulStoffregen/XPT2046_Touchscreen@^1.4.0

build_src_filter = +<*> -<boards/> +<boards/t_hmi/>
build_flags =
    ${env.build_flags}
    -D TARGET_T_HMI=1
    
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D ENABLE_MEM_OVERLAY

    ; --- Flags de Alimentação T-HMI ---
    -D TFT_BACKLIGHT_ON=HIGH
    
    -D PWR_EN_PIN=10
    -D PWR_ON_PIN=14

    -D TOUCHSCREEN_SCLK_PIN=1
    -D TOUCHSCREEN_MISO_PIN=4
    -D TOUCHSCREEN_MOSI_PIN=3
    -D TOUCHSCREEN_CS_PIN=2
    -D TOUCHSCREEN_IRQ_PIN=9

    -D TOUCH_X_MIN=200
    -D TOUCH_X_MAX=3700
    -D TOUCH_Y_MIN=200
    -D TOUCH_Y_MAX=3700

    -D SD_MISO_PIN=13
    -D SD_MOSI_PIN=11
    -D SD_SCLK_PIN=12

    -include $PROJECT_LIBDEPS_DIR/$PIOENV/TFT_eSPI/User_Setups/Setup207_LilyGo_T_HMI.h