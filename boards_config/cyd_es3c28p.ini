; =========================================================================
; AMBIENTE: ES3C28P (ESP32-S3 N16R8 + ILI9341V 2.8" + touch capacitivo FT6336G)
; =========================================================================
[env:ES3C28P]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
build_src_filter = +<*> -<boards/> +<boards/es3c28p/>
build_type = debug
monitor_filters = esp32_exception_decoder

lib_deps =
    ${env.lib_deps}
build_flags =
    ${env.build_flags}
    -D TARGET_ES3C28P=1
    -D ENABLE_MEM_OVERLAY=1
    -D BOARD_HAS_PSRAM=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; --- Display (TFT_eSPI) ---
    -D ILI9341_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_ON=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=13
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=46
    -D TFT_RST=-1
    -D TFT_BL=45
    "-D TFT_BACKLIGHT_ON=HIGH"
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=16000000
    ; --- Touch (FT6336G, I2C) ---
    -D TOUCH_SDA=16
    -D TOUCH_SCL=15
    -D TOUCH_RST=18
    -D TOUCH_INT=17
    ; --- Periféricos ---
    -D PIN_RGB_LED=42
    -D PIN_BAT_ADC=9
    ; --- Fontes TFT_eSPI (redundante mas garante) ---
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SMOOTH_FONT=1

    -D USE_HSPI_PORT=1